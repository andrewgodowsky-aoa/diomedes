name: Build and test

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  local-gates:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      # Root tsc includes services; install the separately pinned service graph.
      - run: npm ci --ignore-scripts --no-audit --no-fund
        working-directory: services/control-plane
      - run: npm run typecheck
        working-directory: services/control-plane
      - run: npm test
        working-directory: services/control-plane
      - run: npm run build
        working-directory: services/control-plane
      - run: npm run check
      # The runner context is only available inside a step, never in a job-level env
      # block, so this pair has to sit here. These gates use synthetic data and mocked
      # providers, never a signed-in account. Two workers, not the default: several
      # suites spawn real child processes (the data-folder lock probe, the harness
      # host, approval crash recovery) and on a four-vCPU runner three workers plus
      # their children starved each other into timeouts that read as failures.
      - run: node node_modules/vitest/vitest.mjs run --maxWorkers=2 --reporter=default --reporter=junit --outputFile=test-results/unit.xml
        env:
          CODEX_HOME: ${{ runner.temp }}/diomedes-ci-codex
      # Packaging (npm run package:windows) requires separately staged pinned
      # native binaries. Client compilation is an independent CI gate.
      - run: node node_modules/vite/bin/vite.js build
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: unit-test-results
          path: test-results/unit.xml
          if-no-files-found: warn
          retention-days: 7

  # Source-development evidence for Apple Silicon (milestone M1). This is a hosted
  # runner: it says nothing about Finder launch, Keychain, signing or a real
  # MacBook, and it packages nothing. No provider credential, signing secret or
  # production data is available to it, by design.
  macos-arm64:
    # The unit suite was written on Windows and has never run on macOS, so its
    # first runs here are expected to find platform assumptions. Until it has
    # passed once, this job runs only when asked for, or on a pull request from a
    # Mac-lane branch, so it cannot turn unrelated pull requests red. Remove this
    # condition once the suite is green on macOS.
    if: >-
      github.event_name == 'workflow_dispatch' ||
      startsWith(github.head_ref, 'feature/apple-silicon') ||
      startsWith(github.head_ref, 'feature/macos')
    # A named image, not macos-latest, whose meaning moves. The first step proves
    # the architecture instead of trusting the label.
    runs-on: macos-15
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
          cache: npm
      - name: Assert Apple Silicon and a native arm64 Node
        run: |
          set -eu
          sw_vers
          test "$(uname -s)" = "Darwin"
          test "$(uname -m)" = "arm64"
          test "$(node -p process.arch)" = "arm64"
          node -p "process.version + ' ' + process.platform + '/' + process.arch"
      - run: npm ci
      # Root tsc includes the separately pinned service graph.
      - run: npm ci --ignore-scripts --no-audit --no-fund
        working-directory: services/control-plane
      # Build must type-check and compile without attempting desktop packaging.
      # Run it before tests so the no-package check describes this step alone.
      - run: npm run build
      - name: Build produced no desktop package
        run: test ! -e release
      # Two workers on a three-core runner. It runs even when the build step
      # failed, so that one failure does not hide what the other would have said.
      - run: node node_modules/vitest/vitest.mjs run --maxWorkers=2 --reporter=default --reporter=junit --outputFile=test-results/unit-macos-arm64.xml
        if: ${{ !cancelled() }}
        env:
          CODEX_HOME: ${{ runner.temp }}/diomedes-ci-codex
          # macOS /var is a symlink. Fixtures must use a real directory because
          # the same product path guard deliberately rejects linked ancestors.
          TMPDIR: ${{ runner.temp }}
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: unit-test-results-macos-arm64
          path: test-results/unit-macos-arm64.xml
          if-no-files-found: warn
          retention-days: 7
