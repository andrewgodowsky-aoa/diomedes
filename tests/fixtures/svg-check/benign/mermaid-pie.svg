<svg id="mermaidpie" width="100%" xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 569.96875 450" style="max-width: 569.96875px;" role="graphics-document document" aria-roledescription="pie"><style>#mermaidpie{font-family:'Segoe UI Variable Text','Segoe UI',system-ui,-apple-system,'Helvetica Neue',Arial,sans-serif;font-size:14px;fill:#e6e9ed;}@keyframes edge-animation-frame{from{stroke-dashoffset:0;}}@keyframes dash{to{stroke-dashoffset:0;}}#mermaidpie .edge-animation-slow{stroke-dasharray:9,5!important;stroke-dashoffset:900;animation:dash 50s linear infinite;stroke-linecap:round;}#mermaidpie .edge-animation-fast{stroke-dasharray:9,5!important;stroke-dashoffset:900;animation:dash 20s linear infinite;stroke-linecap:round;}#mermaidpie .error-icon{fill:#08080c;}#mermaidpie .error-text{fill:#e6e9ed;stroke:#e6e9ed;}#mermaidpie .edge-thickness-normal{stroke-width:1px;}#mermaidpie .edge-thickness-thick{stroke-width:3.5px;}#mermaidpie .edge-pattern-solid{stroke-dasharray:0;}#mermaidpie .edge-thickness-invisible{stroke-width:0;fill:none;}#mermaidpie .edge-pattern-dashed{stroke-dasharray:3;}#mermaidpie .edge-pattern-dotted{stroke-dasharray:2;}#mermaidpie .marker{fill:#44d2c9;stroke:#44d2c9;}#mermaidpie .marker.cross{stroke:#44d2c9;}#mermaidpie svg{font-family:'Segoe UI Variable Text','Segoe UI',system-ui,-apple-system,'Helvetica Neue',Arial,sans-serif;font-size:14px;}#mermaidpie p{margin:0;}#mermaidpie .pieCircle{stroke:#08080c;stroke-width:2px;opacity:0.7;}#mermaidpie .pieCircle.highlighted{scale:1.05;opacity:1;}#mermaidpie .pieCircle.highlightedOnHover:hover{transition-duration:250ms;scale:1.05;opacity:1;}#mermaidpie .pieOuterCircle{stroke:black;stroke-width:2px;fill:none;}#mermaidpie .pieTitleText{text-anchor:middle;font-size:25px;fill:#e6e9ed;font-family:'Segoe UI Variable Text','Segoe UI',system-ui,-apple-system,'Helvetica Neue',Arial,sans-serif;}#mermaidpie .slice{font-family:'Segoe UI Variable Text','Segoe UI',system-ui,-apple-system,'Helvetica Neue',Arial,sans-serif;fill:#08080c;font-size:17px;}#mermaidpie .legend text{fill:#e6e9ed;font-family:'Segoe UI Variable Text','Segoe UI',system-ui,-apple-system,'Helvetica Neue',Arial,sans-serif;font-size:17px;}#mermaidpie .node .neo-node{stroke:#44d2c9;}#mermaidpie [data-look="neo"].node rect,#mermaidpie [data-look="neo"].cluster rect,#mermaidpie [data-look="neo"].node polygon{stroke:url(#mermaidpie-gradient);filter:drop-shadow( 1px 2px 2px rgba(185,185,185,1));}#mermaidpie [data-look="neo"].swimlane.cluster rect{filter:none;}#mermaidpie [data-look="neo"].node path{stroke:url(#mermaidpie-gradient);stroke-width:1px;}#mermaidpie [data-look="neo"].node .outer-path{filter:drop-shadow( 1px 2px 2px rgba(185,185,185,1));}#mermaidpie [data-look="neo"].node .neo-line path{stroke:#44d2c9;filter:none;}#mermaidpie [data-look="neo"].node circle{stroke:url(#mermaidpie-gradient);filter:drop-shadow( 1px 2px 2px rgba(185,185,185,1));}#mermaidpie [data-look="neo"].node circle .state-start{fill:#000000;}#mermaidpie [data-look="neo"].icon-shape .icon{fill:url(#mermaidpie-gradient);filter:drop-shadow( 1px 2px 2px rgba(185,185,185,1));}#mermaidpie [data-look="neo"].icon-shape .icon-neo path{stroke:url(#mermaidpie-gradient);filter:drop-shadow( 1px 2px 2px rgba(185,185,185,1));}#mermaidpie :root{--mermaid-font-family:'Segoe UI Variable Text','Segoe UI',system-ui,-apple-system,'Helvetica Neue',Arial,sans-serif;}</style><g></g><g transform="translate(225,225)"><g><circle cx="0" cy="0" r="186" class="pieOuterCircle"></circle><path d="M0,-185A185,185,0,1,1,-14.162,184.457L0,0Z" fill="#44d2c9" class="pieCircle"></path><path d="M-14.162,184.457A185,185,0,0,1,-117.705,-142.725L0,0Z" fill="#b569fb" class="pieCircle"></path><path d="M-117.705,-142.725A185,185,0,0,1,0,-185L0,0Z" fill="#f97c65" class="pieCircle"></path><text transform="translate(138.6481826207999,5.314504299492417)" class="slice" style="text-anchor: middle;">51%</text><text transform="translate(-132.28374939762162,41.863733055082925)" class="slice" style="text-anchor: middle;">38%</text><text transform="translate(-46.89984187917977,-130.58318165716418)" class="slice" style="text-anchor: middle;">11%</text></g><text x="0" y="-200" class="pieTitleText">Sales by channel</text><g class="legend" transform="translate(216,-33)"><rect width="18" height="18" style="fill: rgb(68, 210, 201); stroke: rgb(68, 210, 201);"></rect><text x="22" y="14">Walk-in</text></g><g class="legend" transform="translate(216,-11)"><rect width="18" height="18" style="fill: rgb(181, 105, 251); stroke: rgb(181, 105, 251);"></rect><text x="22" y="14">Online</text></g><g class="legend" transform="translate(216,11)"><rect width="18" height="18" style="fill: rgb(249, 124, 101); stroke: rgb(249, 124, 101);"></rect><text x="22" y="14">Phone</text></g></g></svg>